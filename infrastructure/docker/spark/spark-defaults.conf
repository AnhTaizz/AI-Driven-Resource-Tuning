spark.master                              yarn
spark.submit.deployMode                   cluster
spark.dynamicAllocation.enabled           false
spark.sql.adaptive.enabled                false
spark.eventLog.enabled                    true
spark.eventLog.dir                        hdfs:///spark-history
spark.eventLog.compress                   true
spark.eventLog.logStageExecutorMetrics    true
spark.history.fs.logDirectory             hdfs:///spark-history
spark.history.fs.update.interval          5s
spark.history.fs.cleaner.enabled           false
spark.history.ui.port                     18080
spark.yarn.archive                        hdfs:///spark/jars/spark-3.5.9-jars.zip
spark.yarn.populateHadoopClasspath         true
spark.yarn.submit.waitAppCompletion        true
spark.pyspark.python                      /opt/python/bin/python3.10
spark.pyspark.driver.python               /opt/python/bin/python3.10
spark.executorEnv.PYSPARK_PYTHON          /opt/python/bin/python3.10
spark.executorEnv.PYTHON_HOME             /opt/python
spark.executorEnv.LD_LIBRARY_PATH         /opt/python/lib
spark.yarn.appMasterEnv.PYSPARK_PYTHON    /opt/python/bin/python3.10
spark.yarn.appMasterEnv.PYTHON_HOME        /opt/python
spark.yarn.appMasterEnv.LD_LIBRARY_PATH    /opt/python/lib
